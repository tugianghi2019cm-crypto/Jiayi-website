name: CI

"on":
  push:
  pull_request:

permissions:
  contents: read

env:
  APP_ENV: test
  APP_BASE_URL: http://localhost:3000
  DATABASE_URL: postgresql://ci:ci@db-does-not-exist:5432/ci

jobs:
  quality:
    name: Quality Gate
    runs-on: ubuntu-latest

    env:
      APP_ENV: test
      APP_BASE_URL: http://localhost:3000
      DATABASE_URL: postgresql://ci:ci@db-does-not-exist:5432/ci

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  db-verification:
    name: Database Verification
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      APP_ENV: test
      APP_BASE_URL: http://localhost:3000
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npm run db:validate

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Verify migrations against PostgreSQL
        run: npm run db:migrate:deploy
